<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocadragón</title>
  <script>
    // GitHub Pages SPA redirect: capta ruta 404 y redirige a index.html preservando la ruta
    const pathWithQuery = location.pathname + location.search + location.hash
    if (!pathWithQuery.includes('?redirect=')) {
      const newUrl = '/?redirect=' + encodeURIComponent(pathWithQuery)
      location.replace(newUrl)
    }
  </script>
</head>
<body>
</body>
</html>
